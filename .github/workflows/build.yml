              --output-dir "$SPV_DIR" \
              --target-hpp "$OUT_HPP" \
              --target-cpp "$CPP_DIR/$name.cpp"
          done

          rm -f "$OUT_CPP"
          cat "$CPP_DIR"/*.cpp > "$OUT_CPP"
          rm -rf "$SPV_DIR" "$CPP_DIR" "$GEN_EXE"

      - name: Generate Makefiles (x86_64)
        run: ./premake5 --os=linux --gmcommon=./garrysmod_common --generator-version=3 --with-vulkan gmake2

      - name: Build (Release x86_64)
        run: make -C projects/linux/gmake2 config=release_x86_64 -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm_auris_linux64_gpu
          path: projects/linux/gmake2/**/gmsv_auris-gpu_linux64.dll
          if-no-files-found: error

  # ── Windows 32-bit CPU ────────────────────────────────────────
  build-win32-cpu:
    name: Windows x86 (CPU)
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
