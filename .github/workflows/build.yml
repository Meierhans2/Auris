          chmod +x premake5
          echo "${{ github.workspace }}" >> $GITHUB_PATH

      - name: Generate Makefiles (x86_64)
        run: ./premake5 --os=linux --gmcommon=./garrysmod_common --generator-version=3 gmake2

      - name: Build (Release x86_64)
        run: make -C projects/linux/gmake2 config=release_x86_64 -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm_auris_linux64_cpu
          path: projects/linux/gmake2/**/gmsv_auris_linux64.dll
          if-no-files-found: error

  # ── Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs:
      - check-version
      - build-win32-gpu
      - build-win64-gpu
      - build-linux32-gpu
      - build-linux64-gpu
      - build-win32-cpu
      - build-win64-cpu
      - build-linux32-cpu
      - build-linux64-cpu
    # Only publish on push to main (not PRs), and only when VERSION changed
    if: |
      github.event_name != 'pull_request' &&
      needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Group + zip artifacts (GPU/ vs CPU/)
        run: |
          set -e
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p release/GPU release/CPU
          # Flatten each artifact dir to just its .dll files, then zip.
          # upload-artifact preserves the deep build path; users want a flat zip.
          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              *_gpu) variant=GPU ;;
              *_cpu) variant=CPU ;;
              *) echo "Skipping unknown artifact $name" >&2; continue ;;
            esac
            base="${name%_gpu}"
            base="${base%_cpu}"
            staging=$(mktemp -d)
            find "$d" -type f -name '*.dll' -exec cp {} "$staging/" \;
            zipname="auris-v${VERSION}-${base}-$(echo $variant | tr '[:upper:]' '[:lower:]').zip"
            (cd "$staging" && zip -j "$GITHUB_WORKSPACE/release/$variant/$zipname" *.dll)
            rm -rf "$staging"
          done
          find release -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Auris v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/GPU/*.zip
            release/CPU/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
