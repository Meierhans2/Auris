name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Version gate ──────────────────────────────────────────────
  check-version:
    name: Check VERSION changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect VERSION change
        id: check
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # On pull_request compare HEAD vs base; on push compare HEAD vs HEAD~1.
          # workflow_dispatch always builds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qx 'VERSION'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows 32-bit GPU ────────────────────────────────────────
  build-win32-gpu:
    name: Windows x86 (GPU)
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Download premake5
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-windows.zip"
          Invoke-WebRequest $url -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath premake5_bin
          echo "${{ github.workspace }}\premake5_bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Patch ggml-vulkan.cpp for MSVC operator<<
        shell: powershell
        run: |
          $f = "vendor\whisper.cpp\ggml\src\ggml-vulkan\ggml-vulkan.cpp"
          $content = [System.IO.File]::ReadAllText($f)
          if ($content -notmatch 'operator<<\(std::ostream') {
            $old = '#include <vulkan/vulkan.hpp>'
            $inject = $old + "`r`n`r`n#ifdef _MSC_VER`r`n#include <ostream>`r`ninline std::ostream& operator<<(std::ostream& os, vk::Buffer const&) { return os; }`r`n#endif"
            $content = $content.Replace($old, $inject)
            [System.IO.File]::WriteAllText($f, $content)
          }

      - name: Compile Vulkan shaders
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set VENDOR_WHISPER_DIR=%CD%\vendor\whisper.cpp
          set SHADERS_DIR=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\vulkan-shaders
          set GEN_SRC=%SHADERS_DIR%\vulkan-shaders-gen.cpp
          set GEN_EXE=%CD%\vulkan-shaders-gen.exe
          set SPV_DIR=%CD%\shader_spv
          set CPP_DIR=%CD%\shader_cpp
          set OUT_CPP=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\ggml-vulkan-shaders.cpp
          set OUT_HPP=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\ggml-vulkan-shaders.hpp

          cl.exe /nologo /EHsc /O2 /std:c++17 /permissive- /Fe:"%GEN_EXE%" "%GEN_SRC%"
          if errorlevel 1 exit /b 1

          if exist "%SPV_DIR%" rmdir /s /q "%SPV_DIR%"
          if exist "%CPP_DIR%" rmdir /s /q "%CPP_DIR%"
          mkdir "%SPV_DIR%"
          mkdir "%CPP_DIR%"

          "%GEN_EXE%" --output-dir "%SPV_DIR%" --target-hpp "%OUT_HPP%"

          for %%F in ("%SHADERS_DIR%\*.comp") do (
            "%GEN_EXE%" --glslc "%VULKAN_SDK%\Bin\glslc.exe" --source "%%F" --output-dir "%SPV_DIR%" --target-hpp "%OUT_HPP%" --target-cpp "%CPP_DIR%\%%~nF.cpp"
            if errorlevel 1 exit /b 1
          )

          if exist "%OUT_CPP%" del "%OUT_CPP%"
          for %%F in ("%CPP_DIR%\*.cpp") do type "%%F" >> "%OUT_CPP%"

          rmdir /s /q "%SPV_DIR%"
          rmdir /s /q "%CPP_DIR%"
          del "%GEN_EXE%" 2>nul

      - name: Generate VS solution (x86)
        shell: cmd
        run: premake5.exe --os=windows --gmcommon=./garrysmod_common --with-vulkan vs2022

      - name: Build (Release x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          msbuild projects\windows\vs2022\auris-gpu.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm_auris_win32_gpu
          path: projects/windows/vs2022/**/Release/**/*.dll
          if-no-files-found: error

  # ── Windows 64-bit GPU ────────────────────────────────────────
  build-win64-gpu:
    name: Windows x86_64 (GPU)
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Switch garrysmod_common to x86-64-support-sourcesdk
        shell: bash
        run: |
          cd garrysmod_common
          git fetch origin x86-64-support-sourcesdk
          git checkout -B x86-64-support-sourcesdk FETCH_HEAD
          git submodule update --init --recursive

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Download premake5
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-windows.zip"
          Invoke-WebRequest $url -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath premake5_bin
          echo "${{ github.workspace }}\premake5_bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Patch ggml-vulkan.cpp for MSVC operator<<
        shell: powershell
        run: |
          $f = "vendor\whisper.cpp\ggml\src\ggml-vulkan\ggml-vulkan.cpp"
          $content = [System.IO.File]::ReadAllText($f)
          if ($content -notmatch 'operator<<\(std::ostream') {
            $old = '#include <vulkan/vulkan.hpp>'
            $inject = $old + "`r`n`r`n#ifdef _MSC_VER`r`n#include <ostream>`r`ninline std::ostream& operator<<(std::ostream& os, vk::Buffer const&) { return os; }`r`n#endif"
            $content = $content.Replace($old, $inject)
            [System.IO.File]::WriteAllText($f, $content)
          }

      - name: Compile Vulkan shaders
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set VENDOR_WHISPER_DIR=%CD%\vendor\whisper.cpp
          set SHADERS_DIR=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\vulkan-shaders
          set GEN_SRC=%SHADERS_DIR%\vulkan-shaders-gen.cpp
          set GEN_EXE=%CD%\vulkan-shaders-gen.exe
          set SPV_DIR=%CD%\shader_spv
          set CPP_DIR=%CD%\shader_cpp
          set OUT_CPP=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\ggml-vulkan-shaders.cpp
          set OUT_HPP=%VENDOR_WHISPER_DIR%\ggml\src\ggml-vulkan\ggml-vulkan-shaders.hpp

          cl.exe /nologo /EHsc /O2 /std:c++17 /permissive- /Fe:"%GEN_EXE%" "%GEN_SRC%"
          if errorlevel 1 exit /b 1

          if exist "%SPV_DIR%" rmdir /s /q "%SPV_DIR%"
          if exist "%CPP_DIR%" rmdir /s /q "%CPP_DIR%"
          mkdir "%SPV_DIR%"
          mkdir "%CPP_DIR%"

          "%GEN_EXE%" --output-dir "%SPV_DIR%" --target-hpp "%OUT_HPP%"

          for %%F in ("%SHADERS_DIR%\*.comp") do (
            "%GEN_EXE%" --glslc "%VULKAN_SDK%\Bin\glslc.exe" --source "%%F" --output-dir "%SPV_DIR%" --target-hpp "%OUT_HPP%" --target-cpp "%CPP_DIR%\%%~nF.cpp"
            if errorlevel 1 exit /b 1
          )

          if exist "%OUT_CPP%" del "%OUT_CPP%"
          for %%F in ("%CPP_DIR%\*.cpp") do type "%%F" >> "%OUT_CPP%"

          rmdir /s /q "%SPV_DIR%"
          rmdir /s /q "%CPP_DIR%"
          del "%GEN_EXE%" 2>nul

      - name: Generate VS solution (x86_64)
        shell: cmd
        run: premake5.exe --os=windows --gmcommon=./garrysmod_common --generator-version=3 --with-vulkan vs2022

      - name: Build (Release x64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild projects\windows\vs2022\auris-gpu.sln /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm_auris_win64_gpu
          path: projects/windows/vs2022/**/Release/**/*.dll
          if-no-files-found: error

  # ── Linux 32-bit GPU ──────────────────────────────────────────
  build-linux32-gpu:
    name: Linux x86 (GPU)
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (32-bit)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib \
            libvulkan-dev libvulkan-dev:i386 \
            cmake

      - name: Install glslc from LunarG SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y shaderc

      - name: Overlay newer Vulkan headers
        run: |
          VK_TAG=v1.3.290
          git clone --depth 1 --branch $VK_TAG https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh
          git clone --depth 1 --branch $VK_TAG https://github.com/KhronosGroup/Vulkan-Hpp.git /tmp/vkhpp
          sudo cp -rf /tmp/vkh/include/vulkan/* /usr/include/vulkan/
          sudo cp -rf /tmp/vkh/include/vk_video/* /usr/include/vk_video/ 2>/dev/null || true
          sudo cp -rf /tmp/vkhpp/vulkan/* /usr/include/vulkan/

      - name: Download premake5
        run: |
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-linux.tar.gz
          tar -xzf premake-5.0.0-beta4-linux.tar.gz
          chmod +x premake5
          echo "${{ github.workspace }}" >> $GITHUB_PATH

      - name: Patch ggml-vulkan.cpp for GCC Properties2 conversion
        run: |
          f=vendor/whisper.cpp/ggml/src/ggml-vulkan/ggml-vulkan.cpp
          sed -i 's|VkPhysicalDeviceProperties2 props = vkdev\.getProperties2();|vk::PhysicalDeviceProperties2 props = vkdev.getProperties2();|' "$f"
          grep -q 'vk::PhysicalDeviceProperties2 props = vkdev.getProperties2' "$f"

      - name: Patch ggml-cpu quants.c for 32-bit BMI2 (_pdep_u64 undefined on i386)
        run: |
          sed -i 's/#ifdef __BMI2__/#if defined(__BMI2__) \&\& defined(__x86_64__)/g' \
            vendor/whisper.cpp/ggml/src/ggml-cpu/arch/x86/quants.c

      - name: Compile Vulkan shaders
        run: |
          set -e
          VENDOR_WHISPER_DIR="$PWD/vendor/whisper.cpp"
          SHADERS_DIR="$VENDOR_WHISPER_DIR/ggml/src/ggml-vulkan/vulkan-shaders"
          GEN_EXE="$PWD/vulkan-shaders-gen"
          SPV_DIR="$PWD/shader_spv"
          CPP_DIR="$PWD/shader_cpp"
          OUT_CPP="$VENDOR_WHISPER_DIR/ggml/src/ggml-vulkan/ggml-vulkan-shaders.cpp"
          OUT_HPP="$VENDOR_WHISPER_DIR/ggml/src/ggml-vulkan/ggml-vulkan-shaders.hpp"

          g++ -O2 -std=c++17 -o "$GEN_EXE" "$SHADERS_DIR/vulkan-shaders-gen.cpp"

          rm -rf "$SPV_DIR" "$CPP_DIR"
          mkdir -p "$SPV_DIR" "$CPP_DIR"

          "$GEN_EXE" --output-dir "$SPV_DIR" --target-hpp "$OUT_HPP"

          for f in "$SHADERS_DIR"/*.comp; do
            name=$(basename "$f" .comp)
            "$GEN_EXE" --glslc glslc --source "$f" \
              --output-dir "$SPV_DIR" \
              --target-hpp "$OUT_HPP" \
              --target-cpp "$CPP_DIR/$name.cpp"
          done

          rm -f "$OUT_CPP"
          cat "$CPP_DIR"/*.cpp > "$OUT_CPP"
          rm -rf "$SPV_DIR" "$CPP_DIR" "$GEN_EXE"

      - name: Generate Makefiles (x86)
        run: ./premake5 --os=linux --gmcommon=./garrysmod_common --with-vulkan gmake2

      - name: Build (Release x86)
        run: make -C projects/linux/gmake2 config=release_x86 -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm_auris_linux32_gpu
          path: projects/linux/gmake2/**/gmsv_auris-gpu_linux.dll
          if-no-files-found: error

  # ── Linux 64-bit GPU ──────────────────────────────────────────
  build-linux64-gpu:
